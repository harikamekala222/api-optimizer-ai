name: API Optimizer AI CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  # 1. Backend Test & Verification
  backend-test:
    name: 🐍 FastAPI Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run Backend Test Suite
        env:
          PYTHONPATH: .
        run: |
          python scratch/test_sprint8.py


  # 2. Frontend Build Verification
  frontend-build:
    name: ⚛️ React Frontend Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install React Dependencies & Build
        env:
          CI: "false"
          DISABLE_ESLINT_PLUGIN: "true"
        run: |
          cd frontend
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          DISABLE_ESLINT_PLUGIN=true CI=false npm run build


  # 3. Docker Compose Validation
  docker-build:
    name: 🐳 Docker Container Build Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build Docker Images
        run: |
          docker compose build


  # 4. Deploy to AWS EC2
  deploy:
    name: 🚀 Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: [docker-build]

    # Deploy ONLY when code is pushed to main.
    # Do not deploy on pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Deploy Application to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "======================================"
            echo "Starting API Optimizer AI Deployment"
            echo "======================================"

            cd ~/api-optimizer-ai

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Checking Docker..."
            docker --version
            docker compose version

            echo "Stopping old containers..."
            docker compose down

            echo "Building latest Docker images..."
            docker compose build

            echo "Starting application..."
            docker compose up -d

            echo "Waiting for containers..."
            sleep 15

            echo "Container status:"
            docker compose ps

            echo "Cleaning unused Docker images..."
            docker image prune -f

            echo "======================================"
            echo "Deployment Completed Successfully"
            echo "======================================"
